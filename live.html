<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电视直播 - LibreTV</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0f1c; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:0; background:rgba(10,15,28,.92); backdrop-filter:blur(8px); z-index:10; border-bottom:1px solid rgba(255,255,255,.06); }
  header .logo { font-size:22px; font-weight:800; background:linear-gradient(90deg,#38bdf8,#e879f9); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header .home { margin-left:auto; color:#e5e7eb; text-decoration:none; background:#1f2937; padding:8px 14px; border-radius:8px; font-size:14px; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  .player-box { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .player-box iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .now { margin:12px 2px 4px; font-size:15px; color:#cbd5e1; }
  .now b { color:#fff; }
  h2 { font-size:16px; margin:20px 2px 10px; color:#e2e8f0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .ch { background:#141b2d; border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:14px 10px; text-align:center; cursor:pointer; transition:.15s; user-select:none; }
  .ch:hover { background:#1d2740; transform:translateY(-1px); }
  .ch.active { background:linear-gradient(135deg,#db2777,#7c3aed); border-color:transparent; }
  .ch .name { font-size:15px; font-weight:600; }
  .ch .sub { font-size:12px; color:#94a3b8; margin-top:4px; }
  .ch.active .sub { color:#fbcfe8; }
  .tip { margin:18px 2px; font-size:12px; color:#64748b; line-height:1.7; }
</style>
</head>
<body>
<header>
  <span style="font-size:22px">📺</span>
  <span class="logo">电视直播</span>
  <a class="home" href="index.html">← 返回影视首页</a>
</header>
<div class="wrap">
  <div class="player-box"><iframe id="player" src="" title="直播播放器" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></div>
  <div class="now">正在播放：<b id="nowName">请选择频道</b></div>

  <h2>新闻直播（24 小时）</h2>
  <div class="grid" id="newsGrid"></div>

  <p class="tip">直播信号来自各电视台官方 YouTube 24 小时直播，点选频道即可播放；个别频道如遇官方临时关播，可切换其他频道。建议在 Wi-Fi 下观看。</p>
</div>
<script>
  // 频道列表：name 显示名, sub 副标题, id = YouTube 24小时直播视频ID
  const CHANNELS = [
    { name: 'TVBS 新闻', sub: '55频道 · 24小时', id: 'Hu1FkdAOws0' },
    { name: '三立新闻', sub: 'SET LIVE · 24小时', id: 'yeYC0mbSIOo' },
    { name: '东森新闻', sub: '51频道 · 24小时', id: 'RaIJ767Bj_M' },
    { name: '东森财经', sub: '57频道 · 24小时', id: 'dphWo0r27Z4' },
    { name: '民视新闻', sub: 'FTV · HD直播', id: 'XxJKnDLYZz4' },
    { name: '中天新闻', sub: 'CTI · 24小时', id: 'wUPPkSANpyo' },
    { name: '华视新闻', sub: 'CTS · HD直播', id: 'TL8mmew3jb8' },
    { name: '中视新闻', sub: 'CTV · LIVE', id: 'XBne4oJGEhE' },
    { name: '台视新闻', sub: 'TTV · 24小时', id: 'yk2CUjbyyQY' },
    { name: '公共电视', sub: 'PTS · 网络直播', id: 'ED4QXd5xAco' }
  ];

  const grid = document.getElementById('newsGrid');
  const player = document.getElementById('player');
  const nowName = document.getElementById('nowName');

  function play(ch, el) {
    document.querySelectorAll('.ch').forEach(c => c.classList.remove('active'));
    if (el) el.classList.add('active');
    nowName.textContent = ch.name;
    player.src = 'https://www.youtube.com/embed/' + ch.id + '?autoplay=1&mute=0&playsinline=1&rel=0';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  CHANNELS.forEach((ch, i) => {
    const d = document.createElement('div');
    d.className = 'ch';
    d.innerHTML = '<div class="name">' + ch.name + '</div><div class="sub">' + ch.sub + '</div>';
    d.onclick = () => play(ch, d);
    grid.appendChild(d);
    if (i === 0) setTimeout(() => play(ch, d), 300);
  });
</script>
</body>
</html>
